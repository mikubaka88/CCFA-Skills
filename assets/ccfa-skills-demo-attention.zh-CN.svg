<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img">

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8EA0C5"/>
  </marker>
  <filter id="softShadow" x="-15%" y="-20%" width="130%" height="145%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2F3A5F" flood-opacity="0.10"/>
  </filter>
  <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#F8FAFF"/>
    <stop offset="100%" stop-color="#EEF3FF"/>
  </linearGradient>
</defs>

<rect width="1200" height="440" fill="url(#hero)"/>
<style>
text { font-family: "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
.small { fill: #667085; font-size: 13px; }
.mono { font-family: "JetBrains Mono", Consolas, monospace; }
</style>
<text x="60" y="58" font-size="30" font-weight="800" fill="#233044" text-anchor="start">Demo：注意力研究路由</text>
<rect x="95" y="155" width="140" height="105" rx="22" fill="#DDEBFF" stroke="#D9E1F2" stroke-width="1.4" filter="url(#softShadow)"/>
<text x="165" y="210" font-size="18" font-weight="850" fill="#233044" text-anchor="middle">想法</text>
<line x1="240" y1="208" x2="300" y2="208" stroke="#AAB7D4" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="275" y="155" width="140" height="105" rx="22" fill="#E9DFFF" stroke="#D9E1F2" stroke-width="1.4" filter="url(#softShadow)"/>
<text x="345" y="210" font-size="18" font-weight="850" fill="#233044" text-anchor="middle">评审</text>
<line x1="420" y1="208" x2="480" y2="208" stroke="#AAB7D4" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="455" y="155" width="140" height="105" rx="22" fill="#DFF7EA" stroke="#D9E1F2" stroke-width="1.4" filter="url(#softShadow)"/>
<text x="525" y="210" font-size="18" font-weight="850" fill="#233044" text-anchor="middle">检索</text>
<line x1="600" y1="208" x2="660" y2="208" stroke="#AAB7D4" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="635" y="155" width="140" height="105" rx="22" fill="#DFF7EA" stroke="#D9E1F2" stroke-width="1.4" filter="url(#softShadow)"/>
<text x="705" y="210" font-size="18" font-weight="850" fill="#233044" text-anchor="middle">实验</text>
<line x1="780" y1="208" x2="840" y2="208" stroke="#AAB7D4" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="815" y="155" width="140" height="105" rx="22" fill="#FFE1E1" stroke="#D9E1F2" stroke-width="1.4" filter="url(#softShadow)"/>
<text x="885" y="210" font-size="18" font-weight="850" fill="#233044" text-anchor="middle">写作</text>
<line x1="960" y1="208" x2="1020" y2="208" stroke="#AAB7D4" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="995" y="155" width="140" height="105" rx="22" fill="#FFE9C7" stroke="#D9E1F2" stroke-width="1.4" filter="url(#softShadow)"/>
<text x="1065" y="210" font-size="18" font-weight="850" fill="#233044" text-anchor="middle">投稿</text>
<text x="600" y="345" font-size="17" font-weight="700" fill="#667085" text-anchor="middle">README 保留原 demo，仅重生成架构说明图。</text>
