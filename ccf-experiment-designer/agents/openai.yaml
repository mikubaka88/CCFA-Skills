interface:
  display_name: "CCF Experiment Designer"
  short_description: "Design fair experiments and interpret actual research results."
  default_prompt: "Apply $ccf-humanization, then $ccf-common. Use $ccf-experiment-designer for scientific questions, informative comparisons and real-result interpretation. Distinguish the desired capability from a proxy metric; remove redundant runs without shrinking the research objective. Preserve supplied values and protocol facts, and keep proposed studies, execution errors and observations distinct. Integrate engineering only when needed."
