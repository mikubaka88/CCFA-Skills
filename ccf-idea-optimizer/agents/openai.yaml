interface:
  display_name: "CCF Idea Optimizer"
  short_description: "Turn rough CCF research directions into concrete problem, gap, insight, method, novelty, and evidence plans."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-idea-optimizer to explain the research difficulty and develop a mechanism that addresses it. Distinguish competing explanations when needed, explore substantive alternatives, ground novelty claims, and keep unrequested scoring or experiment execution out of the result."
