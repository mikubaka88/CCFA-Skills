interface:
  display_name: "CCF Paper Writer"
  short_description: "Draft complete papers from research documents; revise and polish."
  default_prompt: "Apply $ccf-humanization, then $ccf-common. Use $ccf-paper-writer for the requested prose: recover the scientific point and sentence relationships; for substantive drafting or expression repair, inspect matched real passages and apply the resolved reference_style_search preference. Preserve scientific meaning, source format and the author's closing significance. Keep local edits local; complete full-paper content before requested length fitting and honor result blanks."
