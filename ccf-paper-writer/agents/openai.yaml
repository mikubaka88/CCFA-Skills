interface:
  display_name: "CCF Paper Writer"
  short_description: "Draft complete papers from research documents; revise and polish."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-paper-writer for the requested manuscript. Compose from the supplied scientific objects, operations, observations, and relationships; preserve meaning and source format. For requested source-style learning, inspect a matched source passage before drafting. For a new paper, integrate the research documents, draft full content without an initial page quota, honor requested result blanks, and check global alignment before requested length fitting. Keep local edits local and load only relevant references."
