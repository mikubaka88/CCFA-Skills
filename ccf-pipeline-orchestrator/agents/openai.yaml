interface:
  display_name: "CCF Pipeline Orchestrator"
  short_description: "Coordinate research, engineering, experiments, and task budgets."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-pipeline-orchestrator for the requested plan or authorized end-to-end research. For explicit autonomous research, read autonomous-research.md, coordinate scientific owners with $ccf-research-engineer for needed implementation, reproduction, and training work, and use actual host execution and feedback to retain, discard, or branch within the run contract. Reuse valid groundwork and preserve the latest goal, evidence versions, paths, and budget. Do not confuse a plan with execution or imply unavailable background jobs."
