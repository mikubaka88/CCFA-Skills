interface:
  display_name: "CCF Visual Composer"
  short_description: "Compose Python analysis figures and editable scientific diagrams."
  default_prompt: "Apply $ccf-humanization, then $ccf-common; reuse their applicable active rules. Use $ccf-visual-composer for supplied-data plots and scientific diagrams. Start data-led multi-panel analysis from reusable Python templates; preserve the numerical layer when adding illustrations. Use GPT Image 2 for a purely conceptual architecture unless pure SVG/code-first output is requested. Inspect the result and complete already requested editable formats without another confirmation. Preserve data, topology, and labels. Reuse existing editable source and assets for local changes; refresh only affected requested exports. Keep one canonical source and orderly working directory per figure."
